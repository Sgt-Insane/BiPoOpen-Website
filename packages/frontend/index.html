<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png"/>
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Weck BiPo Open" />
    <meta property="og:title" content="Weck BiPo Open" />
    <meta property="og:description" content="Weck BiPo Open" />
    <title>Weck BiPo Open</title>

    <!-- Farbschema vor dem ersten Rendern setzen, sonst blitzt die helle Seite kurz auf (Logik: src/components/shared/useColorScheme.ts) -->
    <script>
      (function () {
        var scheme = null;
        try { scheme = localStorage.getItem('colorScheme'); } catch (e) {}
        var dark = scheme ? scheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;
        root.classList.toggle('bp-dark', dark);
        root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        root.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1B1E22' : '#ffffff');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
