# Release-Push: Sobald Vercel die neue Version live geschaltet hat (Production-Deploy erfolgreich),
# wird die neueste Version aus packages/frontend/src/releases.json einmal per Push angekuendigt.
# Das Backend verschickt jede Version nur einmal (auch wenn Frontend und Backend beide melden).
#
# Einrichtung (einmalig):
#   1. Im Vercel-Projekt des Backends die Umgebungsvariable RELEASE_PUSH_SECRET setzen (beliebiges langes Geheimnis)
#   2. Im GitHub-Repository unter Settings > Secrets > Actions dasselbe Geheimnis als RELEASE_PUSH_SECRET anlegen
# Fuer ein neues Update: oben in releases.json eine neue Version eintragen und nach main mergen.

name: Release-Push

on:
  deployment_status:

jobs:
  announce:
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Neueste Version ankuendigen
        env:
          RELEASE_PUSH_SECRET: ${{ secrets.RELEASE_PUSH_SECRET }}
        run: |
          if [ -z "$RELEASE_PUSH_SECRET" ]; then
            echo "RELEASE_PUSH_SECRET fehlt - kein Release-Push"
            exit 0
          fi
          RELEASE=$(jq -c '.[-1] | {version, title, notes}' packages/frontend/src/releases.json)
          echo "Release: $RELEASE"
          curl --fail-with-body -sS -X POST "https://bipoopen-backend.vercel.app/push/release" \
            -H "Authorization: Bearer $RELEASE_PUSH_SECRET" \
            -H "Content-Type: application/json" \
            -d "$RELEASE"
